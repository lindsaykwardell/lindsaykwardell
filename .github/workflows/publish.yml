name: Publish

on:
  push:
    branches: [master]
    paths:
      - 'src/content/blog/**'
      - 'sequoia.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Optimize cover images for Sequoia
        run: npm run optimize:covers

      - name: Normalize post tags
        run: npm run tags:normalize

      - name: Check publication is configured
        run: |
          uri=$(node -e "console.log(require('./sequoia.json').publicationUri||'')")
          if [ -z "$uri" ]; then
            echo "sequoia.json has no publicationUri. Run npm run sequoia:setup locally first."
            exit 1
          fi

      - name: Require AT Proto secrets
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
        run: |
          if [ -z "$ATP_IDENTIFIER" ] || [ -z "$ATP_APP_PASSWORD" ]; then
            echo "::error::Set GitHub secrets ATP_IDENTIFIER and ATP_APP_PASSWORD (app password from bsky.app)."
            exit 1
          fi

      - name: Publish to AT Proto
        env:
          ATP_IDENTIFIER: ${{ secrets.ATP_IDENTIFIER }}
          ATP_APP_PASSWORD: ${{ secrets.ATP_APP_PASSWORD }}
        run: npm run sequoia:publish

      - name: Announce new posts on Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
        run: |
          if [ -z "$MASTODON_ACCESS_TOKEN" ]; then
            echo "::warning::MASTODON_ACCESS_TOKEN secret not set — skipping Mastodon announce. Add it under repo Settings → Secrets."
            exit 0
          fi
          npx tsx scripts/announce-mastodon.ts

      - name: Cross-post Programming articles to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::warning::DEVTO_API_KEY secret not set — skipping Dev.to announce. Add it under repo Settings → Secrets."
            exit 0
          fi
          npx tsx scripts/announce-devto.ts

      - name: Sync Sequoia Bluesky refs into frontmatter
        run: npx tsx scripts/sync-social-to-frontmatter.ts

      - name: Commit publish artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sequoia.json .sequoia-state.json src/content/blog public/.well-known public/blog public/photos || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Publish standard.site documents and social announcements"
          git push

      # Best-effort: Netlify auto-deploys in parallel. Wait for live RSS, then
      # ping outbound links on the latest feed item. Re-run workflow if a ping
      # races ahead of deploy.
      - name: Send outbound webmentions
        run: |
          echo "Waiting for Netlify deploy / live RSS…"
          sleep 90
          npm run webmentions:send
